plugins {
    id 'java'
    id 'war'
}

group = 'w2l.inspired'
version = '1.0'


war{
    archiveBaseName ='simpleDao'
    archiveVersion = ''
    from("/src/main/resources"){

        include ('customers.xml')
        into('WEB-INF');
        include ('context.xml')
        into('WEB-INF');
    }

}




repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.springframework', name: 'spring-beans', version: '6.0.9'
    implementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.0.0'
    // Source: https://mvnrepository.com/artifact/org.springframework/spring-webmvc
    implementation 'org.springframework:spring-webmvc:7.0.4'


// https://mvnrepository.com/artifact/log4j/log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    testImplementation group: 'org.mockito', name:'mockito-core',version: '5.3.1'
    testImplementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.0.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.8.2')
    // Source: https://mvnrepository.com/artifact/org.springframework/spring-test
    testImplementation("org.springframework:spring-test:7.0.4")
    //https://mvnrepository.com/artifact/org.glassfish.web/jakarta.servlet.jsp.jstl
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
   // https://mvnrepository.com/artifact/jakarta.servlet.jsp.jstl/jakarta.servlet.jsp.jstl-api
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    //https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:3.1.1'

}

test {
    useJUnitPlatform()
}// https://mvnrepository.com/artifact/org.springframework/spring-beans
