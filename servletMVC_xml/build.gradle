plugins {
    id 'java'
    id 'war'
}

group = 'w2l.inspired'
version = '1.0'


compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}
war{
    archiveBaseName ='servlet'
    archiveVersion = ''
    from("/src/main/resources"){
        include ('context.xml')
        into('WEB-INF');
        include ('index.jsp')
        into('WEB-INF');
    }

    webXml = file('src/main/resources/web.xml')

}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

// https://mvnrepository.com/artifact/log4j/log4j
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
// Source: https://mvnrepository.com/artifact/org.springframework/spring-webmvc
    implementation 'org.springframework:spring-webmvc:7.0.4'
    // Source: https://mvnrepository.com/artifact/org.springframework/spring-web
    implementation 'org.springframework:spring-web:7.0.4'
    implementation 'javax.servlet:jstl:1.2' // JSTL for JSP views
// https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.0.0'
}
test {
    useJUnitPlatform()
}